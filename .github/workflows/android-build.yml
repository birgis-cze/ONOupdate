name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode debug keystore
        run: |
          mkdir -p .github
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > .github/debug.keystore
          ls -la .github/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (manual)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK_ROOT=$SDK_ROOT"
          
          CMDLINE_TOOLS=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$CMDLINE_TOOLS" ]; then
            echo "sdkmanager nenalezen, instaluji cmdline-tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            cd "$SDK_ROOT/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip
            mv cmdline-tools latest
            CMDLINE_TOOLS="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          
          echo "sdkmanager: $CMDLINE_TOOLS"
          
          yes | "$CMDLINE_TOOLS" --licenses || true
          "$CMDLINE_TOOLS" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./gradlew assembleRelease --daemon --parallel --build-cache --stacktrace

      - name: Get version name (z Gradle)
        id: get_version
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Zavolat gradle task, který vypíše verzi
          OUTPUT=$(./gradlew -q printVersionName 2>/dev/null)
          echo "Gradle output:"
          echo "$OUTPUT"
          
          VERSION_NAME=$(echo "$OUTPUT" | grep "VERSION_NAME=" | cut -d= -f2)
          VERSION_CODE=$(echo "$OUTPUT" | grep "VERSION_CODE=" | cut -d= -f2)
          
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "versionCode=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Verze z Gradle: $VERSION_NAME (code: $VERSION_CODE)"

      - name: Rename APK
        run: |
          mkdir -p output
          if [ -f app/build/outputs/apk/release/TankONO_widget.apk ]; then
            cp app/build/outputs/apk/release/TankONO_widget.apk output/TankONO_widget.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk output/TankONO_widget.apk
          fi
          ls -la output/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Verze ${{ steps.get_version.outputs.version }}
          body: |
            **Automatický build #${{ github.run_number }}**
            
            Verze: ${{ steps.get_version.outputs.version }}
            Verze code: ${{ steps.get_version.outputs.versionCode }}
            
            Datum: ${{ github.event.head_commit.timestamp }}
            Autor: ${{ github.event.head_commit.author.name }}
            
            Zpráva: ${{ github.event.head_commit.message }}
          files: output/TankONO_widget.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TankONO_widget
          path: output/TankONO_widget.apk
          retention-days: 90
          if-no-files-found: error
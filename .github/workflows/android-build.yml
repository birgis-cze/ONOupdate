name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode debug keystore
        run: |
          mkdir -p .github
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > .github/debug.keystore
          ls -la .github/

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper chybí, generuji..."
            gradle wrapper --gradle-version 8.7
          else
            echo "Wrapper již existuje"
          fi
          chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          if [ -f app/build/outputs/apk/release/TankONO_widget.apk ]; then
            cp app/build/outputs/apk/release/TankONO_widget.apk output/TankONO_widget.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk output/TankONO_widget.apk
          fi
          ls -la output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TankONO_widget
          path: output/TankONO_widget.apk
          retention-days: 90
          if-no-files-found: error
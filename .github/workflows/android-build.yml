name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode debug keystore
        run: |
          mkdir -p .github
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > .github/debug.keystore
          ls -la .github/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (manual)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK_ROOT=$SDK_ROOT"
          
          CMDLINE_TOOLS=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$CMDLINE_TOOLS" ]; then
            echo "sdkmanager nenalezen, instaluji cmdline-tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            cd "$SDK_ROOT/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip
            mv cmdline-tools latest
            CMDLINE_TOOLS="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          
          echo "sdkmanager: $CMDLINE_TOOLS"
          
          yes | "$CMDLINE_TOOLS" --licenses || true
          "$CMDLINE_TOOLS" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute version
        id: version
        run: |
          # Přečíst major z build.gradle.kts
          MAJOR=$(grep -oP 'val majorVersion = \K\d+' app/build.gradle.kts | head -1)
          if [ -z "$MAJOR" ]; then
            MAJOR="1"
            echo "VAROVÁNÍ: majorVersion nenalezen, používám 1"
          fi
          
          # Přečíst poslední major z .github/last_major.txt
          LAST_MAJOR=""
          if [ -f .github/last_major.txt ]; then
            LAST_MAJOR=$(cat .github/last_major.txt | tr -d '[:space:]')
          fi
          
          # Přečíst poslední counter z .github/counter.txt
          COUNTER=0
          if [ -f .github/counter.txt ]; then
            COUNTER=$(cat .github/counter.txt | tr -d '[:space:]')
          fi
          
          echo "Major: $MAJOR, last major: $LAST_MAJOR, counter: $COUNTER"
          
          # Zjistit nové číslo
          if [ "$MAJOR" = "$LAST_MAJOR" ]; then
            # Stejný major → zvýšit counter
            COUNTER=$((COUNTER + 1))
          else
            # Nový major → reset na 1
            echo "NOVÝ MAJOR → resetuji counter na 1"
            COUNTER=0
          fi
          
          VERSION_NAME="$MAJOR.$COUNTER"
          
          # Uložit nové hodnoty pro commit
          echo "$COUNTER" > .github/counter.txt
          echo "$MAJOR" > .github/last_major.txt
          
          # Zapsat do GITHUB_OUTPUT a GITHUB_ENV
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "counter=$COUNTER" >> $GITHUB_OUTPUT
          echo "VERSION_COUNTER=$COUNTER" >> $GITHUB_ENV
          
          echo "Verze: $VERSION_NAME"

      - name: Build Release APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./gradlew assembleRelease --daemon --parallel --build-cache --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          if [ -f app/build/outputs/apk/release/TankONO_widget.apk ]; then
            cp app/build/outputs/apk/release/TankONO_widget.apk output/TankONO_widget.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk output/TankONO_widget.apk
          fi
          ls -la output/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Verze ${{ steps.version.outputs.version }}
          body: |
            **Automatický build #${{ github.run_number }}**
            
            Verze: ${{ steps.version.outputs.version }}
            
            Datum: ${{ github.event.head_commit.timestamp }}
            Autor: ${{ github.event.head_commit.author.name }}
            
            Zpráva: ${{ github.event.head_commit.message }}
          files: output/TankONO_widget.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit counter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/counter.txt .github/last_major.txt
          git commit -m "Bump version to ${{ steps.version.outputs.version }} [skip ci]" || echo "Nic ke commitu"
          git push || echo "Push selhal (možná konflikt)"

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TankONO_widget
          path: output/TankONO_widget.apk
          retention-days: 90
          if-no-files-found: error
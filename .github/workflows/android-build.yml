name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper chybí, generuji..."
            gradle wrapper --gradle-version 8.7
          else
            echo "Wrapper již existuje"
          fi
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          if [ -f app/build/outputs/apk/debug/TankONO_widget.apk ]; then
            cp app/build/outputs/apk/debug/TankONO_widget.apk output/TankONO_widget.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output/TankONO_widget.apk
          fi
          ls -la output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TankONO_widget
          path: output/TankONO_widget.apk
          retention-days: 90
          if-no-files-found: error
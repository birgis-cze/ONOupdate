name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Pro vytvoření release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode debug keystore
        run: |
          mkdir -p .github
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > .github/debug.keystore
          ls -la .github/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk
            ~/.android
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/build.gradle*') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./gradlew assembleRelease --daemon --parallel --build-cache --stacktrace

      - name: Get version name
        id: get_version
        run: |
          VERSION="${{ github.run_number }}"
          MAJOR="1"
          FULL_VERSION="$MAJOR.$VERSION"
          echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "Verze: $FULL_VERSION"

      - name: Rename APK
        run: |
          mkdir -p output
          if [ -f app/build/outputs/apk/release/TankONO_widget.apk ]; then
            cp app/build/outputs/apk/release/TankONO_widget.apk output/TankONO_widget.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk output/TankONO_widget.apk
          fi
          ls -la output/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Verze ${{ steps.get_version.outputs.version }}
          body: |
            **Automatický build #${{ github.run_number }}**
            
            Datum: ${{ github.event.head_commit.timestamp }}
            Autor: ${{ github.event.head_commit.author.name }}
            
            Zpráva: ${{ github.event.head_commit.message }}
          files: output/TankONO_widget.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TankONO_widget
          path: output/TankONO_widget.apk
          retention-days: 90
          if-no-files-found: error
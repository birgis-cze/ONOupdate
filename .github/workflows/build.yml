name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Fix line endings and permissions
      run: |
        sed -i 's/\r$//' gradlew
        chmod +x gradlew
        ls -la gradle/wrapper/
        file gradle/wrapper/gradle-wrapper.jar || echo "JAR file missing!"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TankONO-Widget
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30